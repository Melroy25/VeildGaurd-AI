# VeilGuard AI — Hand-written benchmark cases
# IMPORTANT: All data is strictly synthetic. No real personal data.
# All items are labelled synthetic per AGENTS.md Rule 10.
# Entity group values: PERSON, PHONE, EMAIL, GOV_ID, FINANCIAL_ACCOUNT, SECRET,
#   CONFIDENTIAL, MEDICAL, QUASI
# expected_decision is under the `company` profile, `standard` destination.

items:

  # ─────────────────────────────────────────────────────
  # Category: direct_pii
  # ─────────────────────────────────────────────────────

  - id: hw-001
    category: direct_pii
    text: "Please update the contact for Priya Nair to mobile 9876543210 and email priya.nair@acmecorp.example."
    task_type: draft_message
    expected_entities:
      - {group: PERSON, value: "Priya Nair"}
      - {group: PHONE, value: "9876543210"}
      - {group: EMAIL, value: "priya.nair@acmecorp.example"}
    expected_decision: redact
    required_spans: []
    combo_risk: false
    notes: "Name + phone + email — classic multi-field PII combo."

