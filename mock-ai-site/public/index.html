<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock AI Chat Interface</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 6px 0;
      color: #38bdf8;
    }
    .config-banner {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    #message-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 6px;
      max-width: 80%;
      word-break: break-word;
      font-size: 0.9rem;
    }
    .msg-user {
      align-self: flex-end;
      background: #0284c7;
      color: #fff;
    }
    .msg-assistant {
      align-self: flex-start;
      background: #334155;
      color: #e2e8f0;
    }
    .composer-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #chat-composer-textarea {
      width: 100%;
      height: 70px;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      resize: none;
    }
    #chat-composer-editable {
      width: 100%;
      min-height: 70px;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-send {
      background: #0284c7;
      color: white;
    }
    .btn-send:hover {
      background: #0369a1;
    }
    .btn-test {
      background: #475569;
      color: #cbd5e1;
      font-size: 0.8rem;
    }
    .btn-test:hover {
      background: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mock AI Chat Testbed</h1>
    <div class="config-banner" id="config-banner">Loading configuration...</div>
  </header>

  <div id="message-list"></div>

  <div id="composer-slot"></div>

  <script src="/app.js"></script>
</body>
</html>
